<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piki Burgers PRO - Sistema de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .view { display: none; }
        .view.active { display: block; }
        .card-img-top { height: 150px; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="showView('inicio')">🍔 Piki Burgers</a>
            <div class="d-flex align-items-center">
                <button class="btn btn-light btn-sm me-2 position-relative" onclick="showView('carrito')">
                    🛒 Carrito <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark">0</span>
                </button>
                <button class="btn btn-outline-light btn-sm me-2" onclick="showView('promociones')">🎁 Club Piki</button>
                <button id="btn-admin" class="btn btn-dark btn-sm" onclick="showView('login')">Admin</button>
                <button id="btn-logout" class="btn btn-outline-light btn-sm view" onclick="logout()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">

        <section id="inicio" class="view active">
            <h2 class="text-center mb-4">Nuestro Menú</h2>
            <div id="menu-clientes" class="row"></div>
        </section>

        <section id="carrito" class="view">
            <h2 class="mb-4">Tu Pedido</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="card p-3 mb-3">
                        <h5>Productos seleccionados</h5>
                        <ul id="lista-carrito" class="list-group list-group-flush"></ul>
                        <div class="text-end mt-3"><h4>Total: <span id="total-carrito">$0</span></h4></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm">
                        <h5>Datos de Entrega y Pago</h5>
                        <hr>
                        <input type="text" id="pay-nombre" class="form-control mb-2" placeholder="Nombre completo">
                        <input type="text" id="pay-direccion" class="form-control mb-2" placeholder="Dirección (Colonia, Calle, Número)">
                        <select id="pay-metodo" class="form-select mb-3">
                            <option value="Efectivo">Efectivo al recibir</option>
                            <option value="Tarjeta">Tarjeta (Simulado)</option>
                        </select>
                        <button onclick="app.finalizarCompra()" class="btn btn-success w-100">Confirmar Pedido</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="promociones" class="view">
            <div class="card shadow p-5 mx-auto text-center" style="max-width: 500px;">
                <h3>🎁 ¡Suscríbete!</h3>
                <p>Solo correos válidos para recibir cupones.</p>
                <input type="text" id="reg-nombre" class="form-control mb-2" placeholder="Nombre">
                <input type="email" id="reg-correo" class="form-control mb-3" placeholder="ejemplo@correo.com">
                <button onclick="app.registrarSuscriptor()" class="btn btn-danger w-100">Registrarme</button>
            </div>
        </section>

        <section id="login" class="view">
            <div class="card shadow p-4 mx-auto" style="max-width: 400px;">
                <h4 class="text-center">Panel Admin</h4>
                <input type="text" id="user" class="form-control mb-2" placeholder="Usuario">
                <input type="password" id="pass" class="form-control mb-3" placeholder="Contraseña">
                <button onclick="checkLogin()" class="btn btn-dark w-100">Entrar</button>
            </div>
        </section>

        <section id="admin-panel" class="view">
            <div class="row">
                <div class="col-md-12 mb-4">
                    <h3>👨‍🍳 Compras Realizadas</h3>
                    <div class="table-responsive">
                        <table class="table table-hover border">
                            <thead class="table-dark"><tr><th>Cliente</th><th>Pedido</th><th>Dirección</th><th>Pago</th><th>Total</th><th>Acción</th></tr></thead>
                            <tbody id="tabla-pedidos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = 'https://nydaappwueaczuuxewky.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55ZGFhcHB3dWVhY3p1dXhld2t5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzOTkzNDgsImV4cCI6MjA4NTk3NTM0OH0.yLEp5-DsyS9iCMJWizr-__5yfi8-D79ANnlsmYHREyU';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        class Sistema {
            constructor() {
                this.carrito = [];
            }

            async cargarMenu() {
                const { data } = await _supabase.from('hamburguesas').select('*');
                const div = document.getElementById('menu-clientes');
                div.innerHTML = '';
                data.forEach(h => {
                    div.innerHTML += `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body">
                                    <h5>${h.nombre}</h5>
                                    <p class="text-muted small">${h.descripcion || 'Especialidad de la casa'}</p>
                                    <p class="text-danger fw-bold h5">$${h.precio}</p>
                                    <button onclick="app.agregarAlCarrito('${h.nombre}', ${h.precio})" class="btn btn-outline-danger btn-sm w-100">Agregar al carrito</button>
                                </div>
                            </div>
                        </div>`;
                });
            }

            agregarAlCarrito(nombre, precio) {
                this.carrito.push({ nombre, precio });
                this.actualizarCarritoUI();
                alert(`${nombre} agregado al carrito`);
            }

            actualizarCarritoUI() {
                document.getElementById('cart-count').innerText = this.carrito.length;
                const lista = document.getElementById('lista-carrito');
                lista.innerHTML = '';
                let total = 0;
                this.carrito.forEach((item, index) => {
                    total += item.precio;
                    lista.innerHTML += `<li class="list-group-item d-flex justify-content-between">${item.nombre} <span>$${item.precio}</span></li>`;
                });
                document.getElementById('total-carrito').innerText = `$${total}`;
            }

            async registrarSuscriptor() {
                const nombre = document.getElementById('reg-nombre').value;
                const correo = document.getElementById('reg-correo').value;
                
                // VALIDACIÓN DE CORREO (Regex)
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(correo)) {
                    return alert("Por favor, ingresa un correo electrónico válido (ejemplo@dominio.com)");
                }

                const { error } = await _supabase.from('suscriptores').insert([{ nombre, correo }]);
                if (!error) {
                    alert("¡Gracias por registrarte!");
                    showView('inicio');
                } else { alert("Error: El correo ya existe o hubo un problema."); }
            }

            async finalizarCompra() {
                const cliente = document.getElementById('pay-nombre').value;
                const direccion = document.getElementById('pay-direccion').value;
                const metodo = document.getElementById('pay-metodo').value;

                if(!cliente || !direccion || this.carrito.length === 0) return alert("Completa tus datos y agrega productos.");

                const pedidoTexto = this.carrito.map(i => i.nombre).join(', ');
                const total = this.carrito.reduce((sum, i) => sum + i.precio, 0);

                // IMPORTANTE: En el insert estamos mandando los nuevos campos
                // Si no has creado las columnas en Supabase, solo se guardará Cliente y Hamburguesa
                const { error } = await _supabase.from('pedidos').insert([{ 
                    cliente: `${cliente} (${direccion})`, 
                    hamburguesa: pedidoTexto, 
                    total: total 
                }]);

                if(!error) {
                    alert("¡Pedido recibido! Gracias por tu compra.");
                    this.carrito = [];
                    this.actualizarCarritoUI();
                    showView('inicio');
                }
            }

            async cargarAdmin() {
                const { data } = await _supabase.from('pedidos').select('*').order('created_at', {ascending: false});
                const tbody = document.getElementById('tabla-pedidos');
                tbody.innerHTML = '';
                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.cliente.split(' (')[0]}</td>
                            <td>${p.hamburguesa}</td>
                            <td>${p.cliente.split(' (')[1]?.replace(')', '') || 'S/D'}</td>
                            <td>Efectivo/Tarjeta</td>
                            <td>$${p.total}</td>
                            <td><button onclick="app.completar(${p.id})" class="btn btn-sm btn-success">✓</button></td>
                        </tr>`;
                });
            }

            async completar(id) {
                await _supabase.from('pedidos').delete().eq('id', id);
                this.cargarAdmin();
            }
        }

        const app = new Sistema();
        app.cargarMenu();

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function checkLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'piki123') {
                showView('admin-panel');
                document.getElementById('btn-admin').classList.add('view');
                document.getElementById('btn-logout').classList.remove('view');
                app.cargarAdmin();
            } else { alert("Error de acceso"); }
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
